{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 mt-5">
      <h4 class="mb-4 text-center" style="color:#0f2167">Reset Password</h4>

      <div class="d-flex justify-content-center gap-2 mb-4">
        <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold text-white" style="width:32px;height:32px;background:{% if step == '1' %}#0f2167{% else %}#16a34a{% endif %}">1</div>
        <div style="flex:1;height:2px;background:#e5e7eb;margin:auto;"></div>
        <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:32px;height:32px;background:{% if step == '2' %}#0f2167{% else %}#e5e7eb{% endif %};color:{% if step == '2' %}white{% else %}#9ca3af{% endif %}">2</div>
      </div>

      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      {% if step == '1' %}
      <form method="POST">
        <input type="hidden" name="step" value="1">
        <div class="mb-3">
          <label class="form-label fw-semibold">Registered Email</label>
          <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
        </div>
        <button class="btn btn-primary w-100">Send OTP</button>
      </form>

      {% elif step == '2' %}
      <form method="POST">
        <input type="hidden" name="step" value="2">
        <div class="mb-3">
          <label class="form-label fw-semibold">OTP Token</label>
          <input type="text" name="token" class="form-control" placeholder="Enter OTP from console" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">New Password</label>
          <input type="password" name="new_password" class="form-control" placeholder="Min 6 characters" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button class="btn btn-success w-100">Reset Password</button>
      </form>
      {% endif %}

      <div class="text-center mt-3">
        <a href="/login" class="text-muted small">← Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
